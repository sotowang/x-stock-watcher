<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>X Stock Watcher</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><div><strong>X Stock Watcher</strong><span id="statusDot"></span></div><small id="statusText">Stopped</small></header>
  <main>
    <form id="addForm"><input id="handleInput" placeholder="Enter @username or profile URL" autocomplete="off"><button>Add</button></form>
    <div id="handles" class="handles"></div>
    <label class="row"><span>Check interval</span><select id="interval"><option value="1">1 minute</option><option value="2">2 minutes</option><option value="5">5 minutes</option><option value="10">10 minutes</option></select></label>
    <label class="row"><span>Maximum lookback</span><select id="maxAgeDays"><option value="1">1 day</option><option value="2">2 days</option><option value="3">3 days</option><option value="7">7 days</option><option value="14">14 days</option><option value="30">30 days</option></select></label>
    <details id="aiDetails" class="integration">
      <summary>AI analysis <span id="aiState" class="state-badge"></span></summary>
      <label class="model"><span>Chat Completions Endpoint</span><input id="aiEndpoint" value="https://apihub.agnes-ai.com/v1/chat/completions"></label>
      <label class="model"><span>Model</span><input id="aiModel" value="agnes-2.5-flash"></label>
      <label class="model"><span>API Key (stored locally in Chrome)</span><input id="aiApiKey" type="password" autocomplete="off" placeholder="sk-..."></label>
      <small class="integration-hint">Configured API credentials automatically enable AI analysis. Clear the API key to disable it.</small>
    </details>
    <details id="discordDetails" class="integration">
      <summary>Discord delivery <span id="discordState" class="state-badge"></span></summary>
      <label class="model"><span>Discord channel webhook URL (stored locally)</span><input id="discordWebhookURL" type="password" autocomplete="off" placeholder="https://discord.com/api/webhooks/..."></label>
      <button id="testDiscord" class="wide secondary" type="button">Send test message</button>
      <small class="integration-hint">A configured webhook automatically enables delivery. Clear it to disable delivery.</small>
    </details>
    <div id="message" class="message"></div>
    <div class="buttons"><button id="toggle" class="primary"></button><button id="poll" type="button">Check now</button></div>
    <button id="dashboard" class="wide" type="button">Open signal dashboard</button>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
